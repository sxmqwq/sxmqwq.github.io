name: Publish rhythm

on:
  push:
    branches: [main]
    paths:
      - 'rhythm/**'
      - 'scripts/build-rhythm.mjs'
      - '.github/workflows/rhythm.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check lyric rules
        run: node --test rhythm/tests/*.test.mjs
      - name: Build rhythm page
        run: node scripts/build-rhythm.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
