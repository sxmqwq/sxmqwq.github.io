name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - config.json
      - 'static/**'
      - scripts/generate_blog.py
      - '.github/workflows/Gmeek.yml'
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: gmeek-generation
  cancel-in-progress: false

jobs:
  build:
    name: Generate blog under /blog/
    if: ${{ github.event_name != 'issues' || github.event.repository.owner.id == github.event.sender.id }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Generate blog in an isolated workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_blog.py
      - name: Check the assembled site
        run: python3 scripts/validate_site.py
      - name: Commit generated blog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs backup blogBase.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update blog under /blog/'
            git push origin HEAD:main
          fi

  publish:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

